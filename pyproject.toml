[project]
name = "praece-render-app"
version = "0.1.0"
description = "Praece Render app template"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2,<7",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]  # line length is handled by ruff format

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
