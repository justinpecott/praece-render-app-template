# Render Blueprint. Spec: https://render.com/docs/blueprint-spec
# Python version comes from .python-version. Render adds uv because uv.lock is present.
#
# Before the first Blueprint sync, the placeholder service and database names below are
# replaced with this app's name (the database name appears twice). Claude does this in the
# first session (see CLAUDE.md). Renaming after the first sync creates new resources.
services:
  - type: web
    name: my-app
    runtime: python
    plan: starter
    branch: main
    autoDeployTrigger: commit
    buildCommand: uv sync --locked --no-dev && uv run --no-sync python manage.py collectstatic --noinput
    preDeployCommand: uv run --no-sync python manage.py wait_for_db && uv run --no-sync python manage.py migrate --noinput && uv run --no-sync python manage.py ensure_superuser
    startCommand: uv run --no-sync gunicorn mysite.wsgi --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    # Custom domains: uncomment both blocks below and keep them in sync. Render routes these
    # domains to the service (and health-checks them); the app only accepts hosts in CUSTOM_DOMAINS.
    # domains:
    #   - app.example.com
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: my-app-db
          property: connectionString
      # - key: CUSTOM_DOMAINS # comma-separated; must match domains above
      #   value: app.example.com

databases:
  - name: my-app-db
    plan: basic-256mb # smallest paid plan; free databases expire after 30 days
    postgresMajorVersion: "18"
    ipAllowList: [] # internal connections only
